name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-22.04 # oldest supported glibc for dvd-vr
    timeout-minutes: 30
    permissions:
      contents: write     # create the release
      id-token: write     # sign build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential xz-utils
      - run: scripts/build-release.sh "${GITHUB_REF_NAME}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/camdvd-*-linux-x64.tar.gz
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/camdvd-*-linux-x64.tar.gz
            dist/camdvd-*-linux-x64.tar.gz.sha256
            install.sh
          generate_release_notes: true
