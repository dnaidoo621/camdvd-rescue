name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - name: Media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dvdauthor genisoimage 7zip libimage-exiftool-perl gddrescue sg3-utils dvd+rw-tools lsscsi
          . scripts/versions.env
          curl -fsSL -o /tmp/ff.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_TAG/$FFMPEG_ASSET"
          echo "$FFMPEG_SHA256  /tmp/ff.tar.xz" | sha256sum -c -
          mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          echo "CAMDVD_BIN=/tmp/ff/bin" >> "$GITHUB_ENV"
      - name: Synthetic disc images
        run: FFMPEG=/tmp/ff/bin/ffmpeg scripts/make-test-images.sh
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: bash -n install.sh

  vulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz the parsers of untrusted disc data (30 s each)
        run: |
          go test ./internal/carve -run '^$' -fuzz '^FuzzScan$' -fuzztime 30s
          go test ./internal/carve -run '^$' -fuzz '^FuzzParseSCR$' -fuzztime 30s
          go test ./internal/dvdifo -run '^$' -fuzz '^FuzzParse$' -fuzztime 30s
          go test ./internal/discinfo -run '^$' -fuzz '^FuzzParseMediaInfo$' -fuzztime 30s
          go test ./internal/library -run '^$' -fuzz '^FuzzSanitize$' -fuzztime 30s
